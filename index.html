.sheet{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:0 4px max(0px,env(safe-area-inset-bottom))}
.sheet[hidden]{display:none}
.sheet-card{width:min(calc(100vw - 8px),720px);min-height:min(42dvh,360px);max-height:88dvh;background:linear-gradient(180deg,#111511 0%,#050605 100%);border:1.5px solid #b98b00;border-radius:28px 28px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 42px rgba(255,196,0,.24),0 0 22px rgba(255,196,0,.10);overflow:auto;touch-action:pan-y pinch-zoom}
.sheet-handle{width:54px;height:5px;border-radius:999px;background:#888;margin:0 auto 10px}.sheet h2{margin:8px 0 14px;color:#ffd43b;text-align:center}

.sheet-action.green{border-color:#37d900;color:#89ff52}.sheet-action.red{border-color:#ff3727;color:#ff675b}.sheet-action.blue{border-color:#158dff;color:#55afff}.sheet-action.gold{border-color:#d9a900;color:#ffd95d}.sheet-action.wide{width:100%;margin-top:10px}
.sheet-home{width:100%;margin-top:14px;border:1.5px solid #d4a200;border-radius:16px;background:#13100a;color:#ffd43b;padding:15px;font-weight:900;box-shadow:0 0 14px rgba(255,196,0,.14)}.sheet-close{width:100%;margin-top:10px;border:0;border-radius:16px;background:#2c2c2c;color:#fff;padding:14px;font-weight:900}.sheet-copy{line-height:1.45;color:#eee;background:#0b0d0b;border:1px solid #534400;border-radius:12px;padding:13px;margin-bottom:12px}.sheet-input{width:100%;background:#050605;border:1px solid #a67d00;color:#fff;border-radius:12px;padding:14px;margin-bottom:10px;outline:none}.sheet-input:focus{border-color:#76ff00;box-shadow:0 0 12px rgba(118,255,0,.2)}

/* Pulpit MASTER składany z tej samej grafiki; dzięki temu kafelki można przestawiać bez zmiany wyglądu. */
.dashboard-grid{position:absolute;z-index:12;left:0;top:14.6262%;width:100%;height:63.6511%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);overflow:visible}

.tile-sprite img{position:absolute;width:400%;height:785.5319%;max-width:none;max-height:none;user-select:none;pointer-events:none}
.home-screen.editing .tile-sprite{animation:jiggle .13s infinite alternate ease-in-out;filter:brightness(1.08)}
.home-screen.editing .dashboard-tile:nth-child(even) .tile-sprite{animation-direction:alternate-reverse}
.dashboard-tile.dragging{z-index:90!important;overflow:visible;filter:drop-shadow(0 0 12px rgba(118,255,0,.9));opacity:.92}.dashboard-tile.dragging .tile-sprite{overflow:hidden}

@keyframes jiggle{from{transform:rotate(-1.5deg) scale(.972)}to{transform:rotate(1.5deg) scale(.972)}}
.edit-done{position:absolute;z-index:120;top:13.55%;left:50%;transform:translateX(-50%);border:1px solid #76ff00;background:rgba(2,22,2,.95);color:#8cff42;border-radius:999px;padding:7px 18px;font-weight:900;box-shadow:0 0 15px rgba(118,255,0,.45)}

  grid-template-rows:10% 9.4% 26.2% repeat(4,10.1%) 6.2%;

.generic-company .generic-top,
.generic-company .generic-country-title.compact{height:auto}

  padding:3.2% 3.6%;

.generic-company .expand-card small{font-size:clamp(10px,2.9vw,17px)}
.generic-company .generic-footer{
  position:static;
  left:auto;right:auto;bottom:auto;
  height:auto;
  min-height:0;
  align-self:stretch;
}

.generic-top{height:11%;display:grid;grid-template-columns:17% 1fr 20%;align-items:center;border-bottom:1px solid #8d6900;position:relative}.round-back,.round-sync{position:relative;border:1.8px solid #d9aa16;background:#050605;color:#ffc928;border-radius:50%;aspect-ratio:1;box-shadow:0 0 9px rgba(255,196,0,.55),inset 0 0 15px rgba(255,196,0,.08);display:flex;align-items:center;justify-content:center;padding:0;overflow:visible}.round-back{width:74%;justify-self:start;margin-left:8%;font-size:0}.round-back::before{content:"";position:absolute;width:34%;height:34%;border-left:6px solid #ffd34c;border-bottom:6px solid #ffd34c;transform:translateX(-12%) rotate(45deg);border-radius:3px;filter:drop-shadow(0 0 4px rgba(255,196,0,.75))}.round-back::after{content:"";position:absolute;width:39%;height:6px;background:#ffd34c;border-radius:999px;transform:translateX(10%);box-shadow:0 0 5px rgba(255,196,0,.75)}.round-sync{width:70%;justify-self:end;margin-right:4%;color:#72ff00;border-color:#83c815;font-size:0;flex-direction:column}.round-sync::before{content:"⟳";font-size:clamp(27px,7.1vw,45px);font-weight:1000;line-height:1;color:#76ff00;text-shadow:0 0 8px #4cff00;transform-origin:50% 50%}.round-sync small{position:absolute;top:106%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(6px,1.65vw,10px);font-weight:900;color:#76ff00;text-shadow:0 0 6px rgba(76,255,0,.65)}.round-sync.is-syncing::before{animation:crmSyncSpin 1.05s linear infinite}.round-sync.is-syncing{box-shadow:0 0 16px rgba(118,255,0,.55),0 0 20px rgba(255,196,0,.30)}.generic-brand{text-align:center;color:#ffd43b;font-size:clamp(20px,6vw,38px);font-weight:900;line-height:1}.generic-brand b{color:#fff}.generic-brand small{display:block;color:#fff;font-size:clamp(8px,2vw,13px);font-weight:500;margin-top:7px}
.generic-country-title{height:12%;display:flex;gap:4%;align-items:center}.generic-country-title.compact{height:10%}.flag-emoji{font-size:clamp(36px,12vw,72px)}.generic-country-title h1{margin:0;color:#f5f5f5;font-size:clamp(22px,6.5vw,42px);letter-spacing:.5px}.generic-country-title h2{margin:4px 0 0;color:#ffc928;font-size:clamp(12px,3.5vw,22px);font-weight:500}
.generic-search{width:100%;height:6.2%;border:1px solid #b88c00;background:#060806;color:#aaa;border-radius:13px;text-align:left;padding:0 4%;font-size:clamp(14px,4vw,24px)}.generic-filters{height:6.5%;display:grid;grid-template-columns:1.4fr 1.4fr 1.2fr .6fr .6fr;gap:1.2%;padding:1.3% 0}.generic-filters button{border:1px solid #bb8c00;background:#080a08;color:#eee;border-radius:8px;font-size:clamp(9px,2.4vw,16px);font-weight:800}.generic-summary{min-height:15%;border:1px solid #a47b00;border-radius:14px;margin-top:1.5%;padding:3%;display:flex;gap:4%;align-items:center;background:linear-gradient(90deg,#071007,#020402)}.big-flag{font-size:clamp(55px,18vw,110px)}.generic-summary strong{color:#ffc928;font-size:clamp(14px,4vw,26px)}.generic-summary p{margin:5px 0;color:#ddd;font-size:clamp(11px,3vw,18px)}.generic-empty{border:1px solid #755a00;border-radius:14px;padding:5%;margin-top:3%;text-align:center;background:#050705}.generic-empty span{color:#86ff32;font-weight:900;font-size:clamp(15px,4.5vw,28px)}.generic-empty p{color:#d6d6d6;line-height:1.45;font-size:clamp(11px,3.2vw,19px)}.generic-empty button{border:1px solid #d69f00;background:#141008;color:#ffd43b;border-radius:10px;padding:12px;font-weight:800}.generic-footer{position:absolute;left:5.5%;right:5.5%;bottom:3%;height:7%;border:1px solid #8e6a00;border-radius:12px;display:grid;place-items:center;color:#ffc928;font-weight:800;font-size:clamp(10px,3vw,18px)}
.company-card{border:1px solid #8f6d00;border-radius:14px;padding:4%;background:#040604;margin-bottom:2.2%}.company-card h2{margin:0 0 6px;color:#fff;font-size:clamp(21px,6vw,38px)}.company-card p{margin:5px 0;color:#ddd;font-size:clamp(11px,3.2vw,19px)}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2%;margin-top:4%}.quick-grid button{border:1px solid #8f6d00;background:#070907;color:#ffd43b;border-radius:10px;padding:10px 3px;font-weight:800;font-size:clamp(9px,2.5vw,15px)}.quick-grid button:nth-child(1){color:#72ff00;border-color:#4d9c00}.quick-grid button:nth-child(2){color:#28a9ff;border-color:#006ead}.quick-grid button:nth-child(4){color:#ff5b43;border-color:#9f2617}
.expand-card{width:100%;height:10.7%;position:relative;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;border:1px solid #8b6800;border-radius:12px;background:#030503;color:#ffc928;text-align:left;padding:3% 4%;margin:1.3% 0}.expand-card b{font-size:clamp(13px,3.8vw,24px)}.expand-card span{font-size:clamp(20px,5vw,32px)}.expand-card small{grid-column:1/3;color:#ddd;font-size:clamp(10px,3vw,17px);align-self:center}


/* ===== R10 MASTER UI: globalne ikony, złoty błysk, status synchronizacji ===== */
@keyframes crmSyncSpin{to{transform:rotate(360deg)}}
@keyframes crmEnergySpin{to{transform:rotate(360deg)}}
@keyframes crmGoldSweep{0%,72%{transform:translateX(-135%) rotate(9deg);opacity:0}78%{opacity:.08}92%{opacity:.16}100%{transform:translateX(150%) rotate(9deg);opacity:0}}
.screen::after{content:"";position:absolute;z-index:5;top:-25%;left:-30%;width:24%;height:150%;background:linear-gradient(90deg,transparent,rgba(255,240,165,.32),transparent);filter:blur(7px);mix-blend-mode:screen;pointer-events:none;animation:crmGoldSweep 6.5s ease-in-out infinite}
.master-back-overlay,.master-sync-overlay{position:absolute;z-index:70;pointer-events:none;background:#000}
.master-back-overlay{left:1.8%;top:1.25%;width:16.5%;height:10.3%;display:grid;place-items:center;border-radius:18px}
.master-back-orb{position:relative;width:70%;aspect-ratio:1;border-radius:50%;border:1.8px solid #d9aa16;background:#050605;box-shadow:0 0 10px rgba(255,196,0,.58),inset 0 0 16px rgba(255,196,0,.08)}
.master-back-orb::before{content:"";position:absolute;left:31%;top:31%;width:31%;height:31%;border-left:6px solid #ffd34c;border-bottom:6px solid #ffd34c;transform:rotate(45deg);border-radius:3px;filter:drop-shadow(0 0 4px rgba(255,196,0,.8))}
.master-back-orb::after{content:"";position:absolute;left:36%;top:47%;width:36%;height:6px;background:#ffd34c;border-radius:999px;box-shadow:0 0 5px rgba(255,196,0,.8)}
.master-sync-overlay{right:.8%;top:.75%;width:19.5%;height:12.6%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:18px;padding-top:.4%}
.master-sync-orb{position:relative;width:58%;aspect-ratio:1;border-radius:50%;border:1.8px solid #89ce17;background:#050605;display:grid;place-items:center;box-shadow:0 0 12px rgba(118,255,0,.45),0 0 10px rgba(255,196,0,.22);color:#76ff00}
.master-sync-orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 16%,rgba(255,196,0,.95) 23%,transparent 31% 56%,rgba(255,230,95,.65) 64%,transparent 74% 100%);filter:blur(.4px);z-index:-1;opacity:.78}
.master-sync-orb span{font-size:clamp(27px,7.3vw,46px);font-weight:1000;line-height:1;text-shadow:0 0 8px #4cff00;display:block;transform-origin:50% 50%}
.master-sync-label{margin-top:2px;color:#76ff00;font-weight:900;font-size:clamp(7px,1.8vw,11px);line-height:1;text-shadow:0 0 7px rgba(76,255,0,.65);white-space:nowrap}
.master-sync-status{margin-top:4px;border:1px solid #66d900;color:#8cff42;background:rgba(4,18,3,.95);border-radius:999px;padding:3px 7px;font-weight:900;font-size:clamp(5.5px,1.35vw,8px);white-space:nowrap;box-shadow:0 0 9px rgba(118,255,0,.32)}
.master-sync-overlay.is-syncing .master-sync-orb span{animation:crmSyncSpin 1.05s linear infinite}
.master-sync-overlay.is-syncing .master-sync-orb::before{animation:crmEnergySpin 1.7s linear infinite;opacity:1}
.master-sync-overlay.is-done .master-sync-orb{box-shadow:0 0 18px rgba(118,255,0,.65),0 0 11px rgba(255,196,0,.28)}
.sync-state-pill{position:absolute;z-index:25;right:1.2%;top:9.25%;border:1px solid #64d600;border-radius:999px;color:#8cff42;background:rgba(4,18,3,.96);padding:3px 7px;font-size:clamp(5.5px,1.35vw,8px);font-weight:900;pointer-events:none;white-space:nowrap;box-shadow:0 0 9px rgba(118,255,0,.3)}
.generic-company .company-card,.generic-company .expand-card,.generic-company .generic-footer{position:relative;isolation:isolate}
.generic-company .company-card::before,.generic-company .expand-card::before,.generic-company .generic-footer::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 0 44%,rgba(255,240,160,.35) 48%,transparent 52% 100%);opacity:.28;mix-blend-mode:screen}


/* ===== R11: SCROLL / ZOOM / FILTRY LIVE / MASKI RASTRA ===== */
html,body{height:100%;min-height:100%;overflow:hidden!important}

(() => {
  'use strict';
  const APP_VERSION = '1.3.0-master-r43-waluty-live-hard-fix';
  const APP_RELEASE = 'R43 WALUTY LIVE HARD FIX';
  const BUILD_DATE = '26.08.2026';
  const BUILD_TIME = '17:05';
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const sheet = document.getElementById('sheet');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetContent = document.getElementById('sheet-content');
  const debug = new URLSearchParams(location.search).get('debug') === '1';
  if (debug) document.body.classList.add('debug');

  function refreshViewportHeight(){
    const vv = window.visualViewport;
    const h = Math.round(vv?.height || window.innerHeight || document.documentElement.clientHeight || 0);
    if(h > 0) document.documentElement.style.setProperty('--viewport-h', `${h}px`);
  }
  refreshViewportHeight();
  window.addEventListener('resize', refreshViewportHeight, {passive:true});
  window.visualViewport?.addEventListener('resize', refreshViewportHeight, {passive:true});
  window.visualViewport?.addEventListener('scroll', refreshViewportHeight, {passive:true});

  const defaultDashboardOrder = [
    'pulpit','oferty','kalkulator','transport',

    'import','export','zamowienia','produkcja',
    'kontrahenci','mapa-dostaw','magazyn','nowa-oferta',
    'faktury','raporty','magazyn-pdf','ustawienia'
  ];

  const countries = {
    PL:{name:'Polska',count:8,flag:'🇵🇱'}, DE:{name:'Niemcy',count:3,flag:'🇩🇪'},
    CZ:{name:'Czechy',count:0,flag:'🇨🇿'}, SK:{name:'Słowacja',count:0,flag:'🇸🇰'},
    AT:{name:'Austria',count:0,flag:'🇦🇹'}, CH:{name:'Szwajcaria',count:0,flag:'🇨🇭'},
    LT:{name:'Litwa',count:0,flag:'🇱🇹'}, IT:{name:'Włochy',count:0,flag:'🇮🇹'},
    FR:{name:'Francja',count:0,flag:'🇫🇷'}, NL:{name:'Holandia',count:0,flag:'🇳🇱'},
    BE:{name:'Belgia',count:0,flag:'🇧🇪'}, DK:{name:'Dania',count:0,flag:'🇩🇰'}, LV:{name:'Łotwa',count:0,flag:'🇱🇻'}
  };

  const germanyCompanies = {
    'holzpellet-bayern':{name:'HolzPellet Bayern GmbH',city:'Monachium',region:'Bawaria',type:'PRODUCENT',availability:'A1',price:278},
    'eco-waerme-berlin':{name:'Eco Wärme Berlin',city:'Berlin',region:'Berlin',type:'HURTOWNIA',availability:'A1',price:282,phone:'+493012345678',email:'info@ecowaerme-berlin.de'},
    'pellet-handel-sachsen':{name:'Pellet Handel Sachsen',city:'Drezno',region:'Saksonia',type:'SKŁAD / DYSTRYBUTOR',availability:'A2',price:276},
    'biobrennstoff-nord':{name:'BioBrennstoff Nord',city:'Hamburg',region:'Hamburg',type:'PRODUCENT',availability:'A1',price:286},
    'green-pellets-nrw':{name:'Green Pellets NRW GmbH',city:'Düsseldorf',region:'Nadrenia Płn.-Westf.',type:'HURTOWNIA',availability:'A1',price:null}
  };

  const dashboardTiles = {
    'pulpit':{label:'Pulpit',row:0,col:0,action:()=>toast('PULPIT — jesteś na ekranie głównym.')},
    'oferty':{label:'Oferty',row:0,col:1,action:()=>openModuleSheet('OFERTY','Gałąź OFERTY jest aktywna jako punkt wejścia. Kolejne karty dołączymy po zatwierdzeniu ich MASTER.')},
    'kalkulator':{label:'Kalkulator',row:0,col:2,action:()=>openModuleSheet('KALKULATOR','Moduł kalkulatora jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'transport':{label:'Transport',row:0,col:3,action:()=>openModuleSheet('TRANSPORT','Moduł transportu jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'rynki':{label:'Rynki Europy',row:1,col:0,action:()=>go('markets')},
    'waluty':{label:'Waluty',row:1,col:1,action:()=>currencyStart()},
    'dostawcy':{label:'Dostawcy',row:1,col:2,action:()=>openModuleSheet('DOSTAWCY','Moduł DOSTAWCY jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'klienci':{label:'Klienci',row:1,col:3,action:()=>openModuleSheet('KLIENCI','Moduł KLIENCI jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'import':{label:'Import',row:2,col:0,action:()=>openModuleSheet('IMPORT','IMPORT jest aktywny. Docelowo tutaj podłączymy import danych CRM / CSV / JSON.')},
    'export':{label:'Export',row:2,col:1,action:()=>openModuleSheet('EXPORT','EXPORT jest aktywny. Docelowo tutaj podłączymy eksport danych i dokumentów.')},
    'raporty':{label:'Raporty',row:2,col:2,action:()=>openModuleSheet('RAPORTY','Moduł RAPORTY jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'produkcja':{label:'Produkcja',row:2,col:3,action:()=>openModuleSheet('PRODUKCJA','Moduł PRODUKCJA jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'kontrahenci':{label:'Kontrahenci',row:3,col:0,action:()=>openModuleSheet('KONTRAHENCI','Moduł KONTRAHENCI jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'mapa-dostaw':{label:'Mapa dostaw',row:3,col:1,action:()=>openModuleSheet('MAPA DOSTAW','Mapa dostaw jest aktywna jako punkt wejścia. Dane lokalizacji podłączymy z bazą CRM.')},
    'magazyn':{label:'Magazyn',row:3,col:2,action:()=>openModuleSheet('MAGAZYN','Moduł MAGAZYN jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'nowa-oferta':{label:'Nowa oferta',row:3,col:3,action:()=>openModuleSheet('NOWA OFERTA','Generator nowej oferty jest aktywny jako punkt wejścia do gałęzi OFERTY.')},
    'faktury':{label:'Faktury',row:4,col:0,action:()=>openModuleSheet('FAKTURY','Przycisk FAKTURY jest aktywny. Docelowo otworzy kartę wyboru rodzaju faktury.')},
    'ustawienia':{label:'Ustawienia',row:4,col:1,action:()=>openSettingsMaster()},
    'zamowienia':{label:'Zamówienia',row:4,col:2,action:()=>openModuleSheet('ZAMÓWIENIA','Moduł ZAMÓWIENIA jest aktywny jako punkt wejścia do następnej gałęzi.')},
    'magazyn-pdf':{label:'Magazyn PDF',row:4,col:3,action:()=>openModuleSheet('MAGAZYN PDF','Centralny MAGAZYN PDF jest aktywny jako punkt wejścia do następnej gałęzi.')}
  };

  let savedOrder;
  try { savedOrder = JSON.parse(localStorage.getItem('crm13_dashboard_order') || 'null'); } catch { savedOrder = null; }

  // R30 MASTER — CHIRURGICZNA NAPRAWA PULPITU: kanoniczny układ + semantyka kafli.
  // Źródłem prawdy jest zatwierdzona grafika MASTER i poprawne znaczenie każdego kafla.
  // Przy pierwszym uruchomieniu R30 zapisujemy bezpieczną kopię starego układu i ustawiamy
  // dokładny układ MASTER. Późniejsze ręczne przestawienie kafli przez użytkownika nadal
  // może być zapisane — reset wykonuje się tylko raz dla tego schematu.
  const R30_DASHBOARD_SCHEMA_KEY='crm13_dashboard_schema';
  const R30_DASHBOARD_SCHEMA='r30-approved-master-order-actions-v1';
  try{
    if(localStorage.getItem(R30_DASHBOARD_SCHEMA_KEY)!==R30_DASHBOARD_SCHEMA){
      const old=localStorage.getItem('crm13_dashboard_order');
      if(old) localStorage.setItem('crm13_dashboard_order_pre_r30',old);
      savedOrder=[...defaultDashboardOrder];
      localStorage.setItem('crm13_dashboard_order',JSON.stringify(savedOrder));
      localStorage.setItem(R30_DASHBOARD_SCHEMA_KEY,R30_DASHBOARD_SCHEMA);
    }
  }catch{ savedOrder=[...defaultDashboardOrder]; }
  const validSaved = Array.isArray(savedOrder) && savedOrder.length===defaultDashboardOrder.length && defaultDashboardOrder.every(x=>savedOrder.includes(x));

  const state = {
    route: 'home',
    status: localStorage.getItem('crm13_eco_status') || 'AKTYWNY',
    notes: JSON.parse(localStorage.getItem('crm13_eco_notes') || '["v","v","x","blank"]'),
    selectedCountry: localStorage.getItem('crm13_country') || 'DE',
    selectedCompany: localStorage.getItem('crm13_company') || 'eco-waerme-berlin',
    dashboardOrder: validSaved ? savedOrder : [...defaultDashboardOrder],
    dashboardEdit:false,
    marketFilter:'WSZYSCY',
    germanyFilter:'WSZYSCY',
    syncing:false,
    syncDone:false
  };
  // R28 MASTER ENTRY LOCK: zimny start zawsze na PULPICIE.
  // Czyścimy wyłącznie legacy-klucze nawigacji; dane CRM, backupy i układ pulpitu pozostają nietknięte.
  ['crm13_route','crm13_settings_route','crm13_settings_card','crm13_last_settings_route','crm13_last_settings_card'].forEach(k=>{try{localStorage.removeItem(k);}catch{}});
  ['crm13_route','crm13_settings_route','crm13_settings_card','crm13_last_settings_route','crm13_last_settings_card'].forEach(k=>{try{sessionStorage.removeItem(k);}catch{}});


  const liveData = {
    updatedAt: null,
    records: []
  };

  const assistantFeed = {
    updatedAt:null,
    title:'',
    brief:'',
    source:'',
    updates:[],
    records:[]
  };

  function applyAssistantFeed(data){
    if(!data || typeof data!=='object') return false;
    assistantFeed.updatedAt=data.updatedAt||assistantFeed.updatedAt||null;
    assistantFeed.title=data.title||assistantFeed.title||'';
    assistantFeed.brief=data.brief||assistantFeed.brief||'';
    assistantFeed.source=data.source||assistantFeed.source||'';
    assistantFeed.updates=Array.isArray(data.updates)?data.updates:[];
    assistantFeed.records=Array.isArray(data.records)?data.records:[];

    const byId=new Map(liveData.records.map((r,i)=>[String(r.id||''),i]));
    assistantFeed.records.forEach(rec=>{
      if(!rec || !rec.id) return;
      const id=String(rec.id);
      if(byId.has(id)){
        const i=byId.get(id);
        liveData.records[i]={...liveData.records[i],...rec};
      }else{
        byId.set(id,liveData.records.length);
        liveData.records.push(rec);
      }
    });
    assistantFeed.updates.forEach(u=>{
      if(!u || !u.id || !u.patch) return;
      const i=liveData.records.findIndex(r=>String(r.id||'')===String(u.id));
      if(i>=0){
        const prev=liveData.records[i];
        const patch={...u.patch};
        if(Array.isArray(patch.notes)){
          const merged=[...(Array.isArray(prev.notes)?prev.notes:[]),...patch.notes].filter(Boolean);
          patch.notes=[...new Set(merged)];
        }
        liveData.records[i]={...prev,...patch};
      }
    });
    if(assistantFeed.updatedAt && (!liveData.updatedAt || Date.parse(assistantFeed.updatedAt)>Date.parse(liveData.updatedAt))){
      liveData.updatedAt=assistantFeed.updatedAt;
    }
    try{
      localStorage.setItem('crm13_assistant_feed',JSON.stringify(assistantFeed));
      localStorage.setItem('crm13_live_data',JSON.stringify(liveData));
    }catch{}
    return true;
  }

  function loadCachedAssistantFeed(){
    try{
      const cached=JSON.parse(localStorage.getItem('crm13_assistant_feed')||'null');
      if(cached) applyAssistantFeed(cached);
    }catch{}
  }

  async function loadAssistantFeed(){
    try{
      const res=await fetch(`./assistant-feed.json?v=${Date.now()}`,{cache:'no-store'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      return applyAssistantFeed(data);
    }catch{
      loadCachedAssistantFeed();
      return false;
    }
  }

  function openAssistantFeed(){
    const title=assistantFeed.title||'WIADOMOŚĆ ASYSTENTA — CRM LIVE';
    const body=assistantFeed.brief||'Brak zapisanej wiadomości asystenta w bieżącym źródle CRM.';
    openModuleSheet(title,body);
  }

  function loadCachedCrmData(){
    try{
      const cached=JSON.parse(localStorage.getItem('crm13_live_data') || 'null');
      if(cached && Array.isArray(cached.records)){
        liveData.updatedAt=cached.updatedAt || null;
        liveData.records=cached.records;
      }
    }catch{}
  }

  function normalizeLiveRecord(r){
    let cc=(r.countryCode || '').toUpperCase();
    if(!cc){
      const hay=`${r.countryName||''} ${r.address||''}`.toLowerCase();
      const hit=Object.entries(countries).find(([,v])=>hay.includes(v.name.toLowerCase()));
      if(hit) cc=hit[0];
    }
    return {
      id:String(r.id || '').trim(),
      name:String(r.name || '').trim(),
      countryCode:cc,
      countryName:r.countryName || countries[cc]?.name || cc || 'Europa',
      city:r.city || '',
      region:r.region || '',

  async function loadRemoteData(showToast=false){
    let crmOnline=false;
    let feedOnline=false;
    let crmChanged=false;
    const beforeCrm=JSON.stringify(liveData.records||[]);
    const beforeFeed=assistantFeed.updatedAt||'';
    try{
      const res=await fetch(`./crm-data.json?v=${Date.now()}`,{cache:'no-store'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      if(!data || !Array.isArray(data.records)) throw new Error('Nieprawidłowy format danych');
      liveData.updatedAt=data.updatedAt || liveData.updatedAt || new Date().toISOString();
      liveData.records=data.records;
      crmOnline=true;
    }catch(e){
      loadCachedCrmData();
    }

    // R35: feed asystenta jest pobierany NIEZALEŻNIE od crm-data.json.
    // Dzięki temu aktualizacje rekordów są przypisywane nawet gdy główne źródło CRM chwilowo nie odpowiada.
    try{ feedOnline=await loadAssistantFeed(); }catch{ feedOnline=false; }

    try{
      localStorage.setItem('crm13_live_data',JSON.stringify(liveData));
      localStorage.setItem('crm13_last_sync',new Date().toISOString());
      if(feedOnline) localStorage.setItem('crm13_last_feed_sync',new Date().toISOString());
    }catch{}
    crmChanged = beforeCrm!==JSON.stringify(liveData.records||[]) || beforeFeed!==(assistantFeed.updatedAt||'');

    if(showToast){
      if(crmOnline||feedOnline){
        const feedDate=assistantFeed.updatedAt ? dateOnlyPL(new Date(assistantFeed.updatedAt)) : 'brak nowego feedu';
        toast(crmChanged ? `✓ CRM + ASYSTENT zsynchronizowane • feed ${feedDate}` : `✓ Synchronizacja zakończona • brak nowszych zmian`);
      }else toast('Tryb offline — używam ostatniej zapisanej bazy CRM.');
    }
    return crmOnline||feedOnline;
  }

  async function sync(successMessage='✓ Synchronizacja zakończona'){
    if(state.syncing) return;
    const beforeIds=new Set(getLiveRecords().map(r=>r.id));
    state.syncing=true;
    state.syncDone=false;
    render();
    toast('Synchronizacja CRM — sprawdzam bazę...');
    const started=performance.now();
    let online=false;
    try{
      online=await loadRemoteData(false);
      try{
        const reg=await navigator.serviceWorker?.getRegistration();
        if(reg) await reg.update();
      }catch{}
      const elapsed=performance.now()-started;
      if(elapsed<2200) await new Promise(r=>setTimeout(r,2200-elapsed));
    }finally{
      const after=getLiveRecords();
      const newCount=after.filter(r=>!beforeIds.has(r.id)).length;
      localStorage.setItem('crm13_last_sync',new Date().toISOString());
      state.syncing=false;
      state.syncDone=true;
      render();
      if(online){
        toast(newCount ? `✓ Zsynchronizowano • ${newCount} nowych rekordów przypisano do krajów` : `${successMessage} • brak nowych rekordów w źródle CRM`);
      }else{
        toast('Tryb offline — używam ostatniej zapisanej bazy CRM.');
      }
      clearTimeout(sync._doneTimer);
      sync._doneTimer=setTimeout(()=>{state.syncDone=false;render();},2200);
    }
  }

  function normalizeDashboardOrder(order){
    const allowed=new Set(defaultDashboardOrder);
    const unique=[];
    for(const id of Array.isArray(order)?order:[]){
      if(allowed.has(id) && !unique.includes(id)) unique.push(id);
    }
    for(const id of defaultDashboardOrder){
      if(!unique.includes(id)) unique.push(id);
    }
    return unique.slice(0,defaultDashboardOrder.length);
  }

  function saveDashboardOrder(){

  function swapDashboardTiles(idA,idB){
    if(!idA || !idB || idA===idB) return false;
    const order=normalizeDashboardOrder(state.dashboardOrder);
    const a=order.indexOf(idA), b=order.indexOf(idB);
    if(a<0 || b<0) return false;
    [order[a],order[b]]=[order[b],order[a]];
    state.dashboardOrder=normalizeDashboardOrder(order);
    saveDashboardOrder();
    return true;
  }

  function bindDashboardTile(btn,tile){
    let holdTimer=null, startX=0, startY=0, longFired=false, drag=null, canceledGesture=false;
    const clearHold=()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} };

    const cleanupDrag=()=>{
      if(drag?.targetEl) drag.targetEl.classList.remove('drop-target');
      btn.classList.remove('dragging');
      btn.style.transform='';
      if(dashboardDragLock?.tileId===btn.dataset.tileId) dashboardDragLock=null;
      drag=null;
    };

    const indexFromPoint=(x,y)=>{
      const grid=btn.parentElement;
      const r=grid.getBoundingClientRect();
      const xx=Math.max(0,Math.min(r.width-1,x-r.left));
      const yy=Math.max(0,Math.min(r.height-1,y-r.top));
      const col=Math.max(0,Math.min(3,Math.floor(xx/(r.width/4))));
      const row=Math.max(0,Math.min(4,Math.floor(yy/(r.height/5))));
      return row*4+col;
    };

    const markTarget=(index)=>{
      if(!drag) return;
      if(drag.targetEl) drag.targetEl.classList.remove('drop-target');
      const nodes=[...btn.parentElement.querySelectorAll('.dashboard-tile')];
      drag.targetIndex=Math.max(0,Math.min(nodes.length-1,index));
      drag.targetEl=nodes[drag.targetIndex] || null;
      if(drag.targetEl && drag.targetEl!==btn) drag.targetEl.classList.add('drop-target');
    };

    const startEditPointer=(e)=>{
      if(!state.dashboardEdit) return;
      if(dashboardDragLock && dashboardDragLock.pointerId!==e.pointerId) return;

      dashboardDragLock={pointerId:e.pointerId,tileId:btn.dataset.tileId};
      clearHold();
      try{btn.setPointerCapture(e.pointerId);}catch{}

      const order=normalizeDashboardOrder(state.dashboardOrder);
      const sourceIndex=order.indexOf(btn.dataset.tileId);
      drag={
        pointerId:e.pointerId,
        sourceId:btn.dataset.tileId,
        sourceIndex,
        targetIndex:sourceIndex,
        targetEl:null,
        startX:e.clientX,
        startY:e.clientY,
        moved:false,
        lastTargetIndex:sourceIndex
      };
    };

    const handleTapSwap=()=>{
      const id=btn.dataset.tileId;
      if(!dashboardTapSelected){
        dashboardTapSelected=id;
        app.querySelectorAll('.tap-selected').forEach(el=>el.classList.remove('tap-selected'));
        btn.classList.add('tap-selected');
        toast('Wybrano kafelek. Dotknij drugi, aby je zamienić.');
        try{navigator.vibrate?.(18);}catch{}
        return;
      }
      if(dashboardTapSelected===id){
        dashboardTapSelected=null;
        btn.classList.remove('tap-selected');
        toast('Zaznaczenie anulowane.');
        return;
      }
      const first=dashboardTapSelected;
      dashboardTapSelected=null;
      if(swapDashboardTiles(first,id)){
        try{navigator.vibrate?.(28);}catch{}
        render();
        toast('✓ Kafelki zamienione.');
      }
    };

    btn.addEventListener('contextmenu',e=>e.preventDefault());

    btn.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      canceledGesture=false;
      if(!e.isPrimary){ clearHold(); canceledGesture=true; return; }
      startX=e.clientX;
      startY=e.clientY;
      longFired=false;

      if(state.dashboardEdit){
        e.preventDefault();
        startEditPointer(e);
        return;
      }

      // W zwykłym trybie nie blokujemy gestów przeglądarki — pinch-to-zoom pozostaje aktywny.
      holdTimer=setTimeout(()=>{
        if(canceledGesture) return;
        longFired=true;
        // R30: najpierw bezpiecznie wchodzimy w tryb układania. Po puszczeniu palca
        // następne dotknięcie ma już touch-action:none i przeciąganie działa stabilnie na Android/PWA.
        enterDashboardEdit(btn);
        try{navigator.vibrate?.(35);}catch{}
      },650);
    },{passive:false});

    btn.addEventListener('pointermove',e=>{
      if(drag){
        if(e.pointerId!==drag.pointerId) return;
        const dx=e.clientX-drag.startX;
        const dy=e.clientY-drag.startY;
        const dist=Math.hypot(dx,dy);

        if(dist>10){
          drag.moved=true;
          btn.classList.add('dragging');

          // Tylko wizualne przesunięcie. Kolejność DOM pozostaje nietknięta.
          btn.style.transform=`translate(${dx}px,${dy}px) scale(1.045)`;

          const targetIndex=indexFromPoint(e.clientX,e.clientY);
          if(targetIndex!==drag.lastTargetIndex){
            drag.lastTargetIndex=targetIndex;
            markTarget(targetIndex);
            try{navigator.vibrate?.(8);}catch{}
          }
        }
        return;
      }

      if(Math.hypot(e.clientX-startX,e.clientY-startY)>24){ canceledGesture=true; clearHold(); }
    });

    btn.addEventListener('pointerup',e=>{
      clearHold();

      if(drag && e.pointerId===drag.pointerId){
        try{btn.releasePointerCapture(e.pointerId);}catch{}

        const wasMoved=drag.moved;
        const sourceId=drag.sourceId;
        const order=normalizeDashboardOrder(state.dashboardOrder);
        const targetId=order[drag.targetIndex];
        cleanupDrag();

        if(wasMoved && targetId && targetId!==sourceId){
          if(swapDashboardTiles(sourceId,targetId)){
            dashboardTapSelected=null;
            try{navigator.vibrate?.(28);}catch{}
            render();
            toast('✓ Kafelek zamieniony.');
          }
        }else if(!wasMoved && state.dashboardEdit){
          handleTapSwap();
        }
        return;
      }

      try{btn.releasePointerCapture(e.pointerId);}catch{}
      // R30: zwykłe uruchamianie kafla obsługuje natywny CLICK poniżej.
      // Pointer events pozostają wyłącznie dla długiego przytrzymania i przeciągania.
    });

    btn.addEventListener('click',e=>{
      if(state.dashboardEdit || longFired || canceledGesture){ e.preventDefault(); return; }
      activateDashboardTile(btn.dataset.tileId);
    });

    btn.addEventListener('pointercancel',e=>{
      clearHold();
      canceledGesture=true;
      try{btn.releasePointerCapture(e.pointerId);}catch{}
      cleanupDrag();
    });
  }

  function dateOnlyPL(value){
    if(!value) return 'brak';
    try{return new Intl.DateTimeFormat('pl-PL').format(new Date(value));}catch{return String(value)}
  }
  function lastSyncDate(){ return localStorage.getItem('crm13_last_sync') || liveData.updatedAt || null; }
  function recentLiveCount(days=7){
    const now=Date.now(), ms=days*86400000;
    return getLiveRecords().filter(r=>{const t=Date.parse(r.addedAt||'');return Number.isFinite(t) && now-t>=0 && now-t<=ms;}).length;
  }
  function todayLiveCount(){
    const d=new Date(), y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
    return getLiveRecords().filter(r=>{const t=new Date(r.addedAt||'');return !Number.isNaN(t.valueOf())&&t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===day;}).length;
  }
  function marketRolesFor(c){
    const arr=Array.isArray(c.roles)&&c.roles.length ? c.roles : [c.role||''];
    return arr.map(x=>String(x).toUpperCase());
  }
  function companiesForCountry(code){ return getAllCompanies().filter(c=>c.countryCode===code); }
  function countriesForMarketFilter(filter){
    if(filter==='WSZYSCY') return Object.keys(countries);
    const role=filter==='KLIENCI'?'KLIENT':'DOSTAWCA';
    const found=[];
    Object.keys(countries).forEach(code=>{ if(companiesForCountry(code).some(c=>marketRolesFor(c).includes(role))) found.push(code); });
    return found;
  }
  function matchesGermanyFilter(c,filter){
    if(filter==='WSZYSCY') return true;
    const t=String(c.type||'').toUpperCase();
    if(filter==='PRODUCENCI') return t.includes('PRODUCENT');
    if(filter==='HURTOWNIE') return t.includes('HURTOWN');
    if(filter==='SKŁADY') return t.includes('SKŁAD');
    return true;
  }
  function makeMasterCrop(src,crop,baseW,baseH,onClick){
    const box=document.createElement('div'); box.className='master-crop-box';
    const img=document.createElement('img'); img.src=src; img.alt=''; box.append(img);
    if(onClick){ const hit=document.createElement('button'); hit.className='master-crop-hit'; hit.type='button'; hit.addEventListener('click',onClick); box.append(hit); }
    const fit=()=>{
      const w=box.clientWidth; if(!w) return;
      const sc=w/crop.w;
      box.style.height=`${Math.max(1,crop.h*sc)}px`;
      img.style.width=`${baseW*sc}px`; img.style.height=`${baseH*sc}px`;
      img.style.left=`${-crop.x*sc}px`; img.style.top=`${-crop.y*sc}px`;
    };
    requestAnimationFrame(fit);
    if('ResizeObserver' in window){ const ro=new ResizeObserver(fit); ro.observe(box); box._ro=ro; }
    return box;
  }

  function r13CompanyKey(c){return String(c.name||'').trim().toLocaleLowerCase('pl-PL').replace(/\s+/g,' ')}
  function r13Companies(){
    const all=getAllCompanies(), out=[], seen=new Set();
    for(const c of all){const k=r13CompanyKey(c); if(!k||seen.has(k))continue;seen.add(k);out.push(c)}

  function r13Count(code,roleFilter='WSZYSCY'){
    let arr=r13Companies().filter(c=>c.countryCode===code);

      const role=roleFilter==='KLIENCI'?'KLIENT':'DOSTAWCA';
      arr=arr.filter(c=>marketRolesFor(c).includes(role));
    }
    return arr.length;
  }
  function r13RecentForCountry(code,days=7){
    const cutoff=Date.now()-days*86400000;
    return getLiveRecords().filter(r=>r.countryCode===code && Date.parse(r.addedAt||'')>=cutoff).length;
  }
  function r13TypeMatch(c,filter){
    if(!filter||filter==='WSZYSCY')return true;

    if(filter==='HURTOWNIE')return t.includes('HURTOWN')||t.includes('HANDLOWIEC')||t.includes('SIEĆ');
    if(filter==='SKŁADY')return t.includes('SKŁAD');

  function r20WaitForWorker(reg,timeoutMs=12000){
    return new Promise(resolve=>{
      let done=false,poll=null,timer=null;
      const finish=(ok)=>{
        if(done)return;done=true;
        if(poll)clearInterval(poll);if(timer)clearTimeout(timer);
        navigator.serviceWorker?.removeEventListener('controllerchange',onController);
        resolve(ok);
      };
      const onController=()=>finish(true);
      const nudge=()=>{
        const waiting=reg.waiting;
        const worker=waiting||reg.installing;
        if(waiting){try{waiting.postMessage({type:'SKIP_WAITING'});}catch{}}
        else if(worker?.state==='installed'){try{worker.postMessage({type:'SKIP_WAITING'});}catch{}}
        if(worker?.state==='activated')finish(true);
      };
      navigator.serviceWorker?.addEventListener('controllerchange',onController,{once:true});
      reg.addEventListener?.('updatefound',()=>setTimeout(nudge,0));
      poll=setInterval(nudge,120);
      timer=setTimeout(()=>finish(false),timeoutMs);
      nudge();
    });
  }
  async function r20UpdateNow(){

      if(info.version===APP_VERSION){r20SetProgress(100,'Wersja aktualna.','Masz najnowszą wersję '+APP_RELEASE+'.');toast('✓ Aplikacja jest już aktualna.');return;}
      await r20CreateSnapshot('Automatyczny backup przed aktualizacją');
      r20SetProgress(20,'Backup gotowy.','Punkt powrotu został zabezpieczony.');
      const reg=await navigator.serviceWorker?.getRegistration();
      if(!reg){r20SetProgress(0,'Brak Service Workera.','Uruchom aplikację z HTTPS i spróbuj ponownie.');return;}
      r20SetProgress(45,'Pobieram aktualizację…','Nie zamykaj aplikacji.');
      await reg.update();
      await new Promise(r=>setTimeout(r,250));
      if(reg.waiting){r20SetProgress(75,'Nowa wersja pobrana.','Aktywuję aktualizację…');try{reg.waiting.postMessage({type:'SKIP_WAITING'});}catch{}}
      else r20SetProgress(70,'Aktualizacja pobrana.','Kończę aktywację…');
      const activated=await r20WaitForWorker(reg,12000);
      if(!activated){
        // Nie zostawiamy użytkownika na mylącym 75%. Bezpieczny stan końcowy: restart do PULPITU.
        r20SetProgress(95,'Kończę aktualizację…','Uruchamiam aplikację ponownie od PULPITU.');
      }else{

      setTimeout(()=>location.replace('./?build='+encodeURIComponent(targetRelease)+'&screen=home&t='+Date.now()),350);
    }catch(e){
      console.error('Update error',e);

      toast('Nie udało się dokończyć aktualizacji — pozostajesz na '+APP_RELEASE+'.');
    }
  }

  const currencyState={
    rates:{...CURRENCY_FALLBACK},prev:{...CURRENCY_FALLBACK},updatedAt:null,source:'NBP API',online:false,loading:false,
    spreadPct:Number(localStorage.getItem('crm13_currency_spread') ?? currencyDefaults.spreadPct),
    calcAmount:Number(localStorage.getItem('crm13_currency_amount') ?? currencyDefaults.calcAmount),
    calcFrom:localStorage.getItem('crm13_currency_from')||currencyDefaults.calcFrom,
    calcTo:localStorage.getItem('crm13_currency_to')||currencyDefaults.calcTo,
    buyPrice:Number(localStorage.getItem('crm13_currency_buy_price') ?? currencyDefaults.buyPrice),
    buyCurrency:localStorage.getItem('crm13_currency_buy_ccy')||currencyDefaults.buyCurrency,
    salePrice:Number(localStorage.getItem('crm13_currency_sale_price') ?? currencyDefaults.salePrice),
    saleCurrency:localStorage.getItem('crm13_currency_sale_ccy')||currencyDefaults.saleCurrency,
    transport:Number(localStorage.getItem('crm13_currency_transport') ?? currencyDefaults.transport),
    transportCurrency:localStorage.getItem('crm13_currency_transport_ccy')||currencyDefaults.transportCurrency
  };
  const curFmt=(v,d=2)=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(v)||0);
  const curRate=c=>c==='PLN'?1:Number(currencyState.rates[c]||CURRENCY_FALLBACK[c]||1);
  const curChange=c=>{const n=curRate(c),p=Number(currencyState.prev[c]||n);return p?(n-p)/p*100:0};
  const curConvert=(a,f,t)=>(Number(a)||0)*curRate(f)/curRate(t);
  const curTime=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v)).replace(',',' •')}catch{return String(v)}};
  function curPersist(){
    localStorage.setItem('crm13_currency_spread',String(currencyState.spreadPct));
    localStorage.setItem('crm13_currency_amount',String(currencyState.calcAmount));
    localStorage.setItem('crm13_currency_from',currencyState.calcFrom);localStorage.setItem('crm13_currency_to',currencyState.calcTo);
    localStorage.setItem('crm13_currency_buy_price',String(currencyState.buyPrice));localStorage.setItem('crm13_currency_buy_ccy',currencyState.buyCurrency);
    localStorage.setItem('crm13_currency_sale_price',String(currencyState.salePrice));localStorage.setItem('crm13_currency_sale_ccy',currencyState.saleCurrency);
    localStorage.setItem('crm13_currency_transport',String(currencyState.transport));localStorage.setItem('crm13_currency_transport_ccy',currencyState.transportCurrency);
    localStorage.setItem('crm13_currency_cache',JSON.stringify({rates:currencyState.rates,prev:currencyState.prev,updatedAt:currencyState.updatedAt,source:currencyState.source}));
  }
  function curLoadCache(){try{const c=JSON.parse(localStorage.getItem('crm13_currency_cache')||'null');if(c?.rates){currencyState.rates={...CURRENCY_FALLBACK,...c.rates,PLN:1};currencyState.prev={...currencyState.rates,...(c.prev||{}),PLN:1};currencyState.updatedAt=c.updatedAt||null;currencyState.source=c.source||'NBP API • cache';currencyState.online=false}}catch{}}
  function curSaveHistory(){
    try{const key='crm13_currency_history';const a=JSON.parse(localStorage.getItem(key)||'[]');a.unshift({at:currencyState.updatedAt,source:currencyState.source,rates:{...currencyState.rates}});localStorage.setItem(key,JSON.stringify(a.slice(0,30)))}catch{}
  }
  async function currencyRefresh(show=true){
    if(currencyState.loading){if(show)toast('WALUTY LIVE — synchronizacja już trwa.');return false;}
    currencyState.loading=true;
    const started=performance.now();
    if(show)toast('WALUTY LIVE — synchronizuję kursy NBP…');
    if(state.route.startsWith('waluty'))render();
    try{
      const res=await fetch('https://api.nbp.pl/api/exchangerates/tables/A/last/2/?format=json',{cache:'no-store',headers:{Accept:'application/json'}});if(!res.ok)throw new Error('NBP '+res.status);
      const a=await res.json();if(!Array.isArray(a)||!a.length)throw new Error('NBP: brak danych');const cur=a[a.length-1],prev=a[Math.max(0,a.length-2)];
      const pick=t=>Object.fromEntries((t?.rates||[]).filter(x=>CURRENCY_CODES.includes(x.code)).map(x=>[x.code,Number(x.mid)]));
      currencyState.rates={PLN:1,...currencyState.rates,...pick(cur)};currencyState.prev={PLN:1,...currencyState.prev,...pick(prev)};currencyState.updatedAt=new Date().toISOString();currencyState.source=`NBP API • ${cur?.no||''}`;currencyState.online=true;curPersist();curSaveHistory();
      const wait=Math.max(0,720-(performance.now()-started));if(wait)await new Promise(r=>setTimeout(r,wait));
      if(show)toast('✓ WALUTY LIVE — kursy NBP zaktualizowane.');
    }catch(e){
      curLoadCache();currencyState.online=false;
      const wait=Math.max(0,720-(performance.now()-started));if(wait)await new Promise(r=>setTimeout(r,wait));
      if(show)toast('WALUTY — brak połączenia. Używam ostatniego zapisanego kursu.');
    } finally {
      currencyState.loading=false;if(state.route.startsWith('waluty'))render();
    }
    return currencyState.online;
  }
  function currencyStart(){state.route='waluty1';render();window.scrollTo({top:0,left:0,behavior:'auto'});currencyRefresh(false)}
  function currencyGo(n,announce=false){n=Math.max(1,Math.min(4,Number(n)||1));state.route='waluty'+n;render();window.scrollTo({top:0,left:0,behavior:'auto'});if(announce)toast(`WALUTY 1/${n}`);if(!currencyState.updatedAt)currencyRefresh(false)}

  const WM_W=852,WM_H=1846;
  function wmRect(el,[x,y,w,h],W=WM_W,H=WM_H){Object.assign(el.style,{left:(x/W*100)+'%',top:(y/H*100)+'%',width:(w/W*100)+'%',height:(h/H*100)+'%'});return el}
  function wmHot(root,rect,fn,label,W=WM_W,H=WM_H){const b=document.createElement('button');b.type='button';b.className='wm-hot';b.setAttribute('aria-label',label||'Akcja');wmRect(b,rect,W,H);b.addEventListener('pointerdown',()=>b.classList.add('wm-pressed'));['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('wm-pressed')));b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();b.classList.remove('wm-pressed');fn()});root.append(b);return b}
  function wmLive(root,rect,html,cls='',W=WM_W,H=WM_H){const d=document.createElement('div');d.className='wm-live '+cls;d.innerHTML=html;wmRect(d,rect,W,H);root.append(d);return d}
  function wmDyn(root,rect,text,cls='',W=WM_W,H=WM_H){const d=document.createElement('div');d.className='wm-dyn '+cls;d.textContent=text;wmRect(d,rect,W,H);root.append(d);return d}
  function wmEdit(root,rect,value,onChange,cls='med',W=WM_W,H=WM_H){const i=document.createElement('input');i.type='number';i.inputMode='decimal';i.step='0.01';i.value=String(value);i.className='wm-edit '+cls;wmRect(i,rect,W,H);const save=()=>{const v=Number(String(i.value).replace(',','.'));if(Number.isFinite(v)){onChange(v);curPersist()}};i.addEventListener('input',save);i.addEventListener('change',save);i.addEventListener('blur',save);root.append(i);return i}
  function wmSelect(root,rect,selected,onPick,W=WM_W,H=WM_H){const s=document.createElement('select');s.className='wm-select';s.setAttribute('aria-label','Wybierz walutę');CURRENCY_CODES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=`${CURRENCY_FLAGS[c]} ${c} — ${CURRENCY_NAMES[c]}`;o.selected=c===selected;s.append(o)});wmRect(s,rect,W,H);s.addEventListener('change',()=>{onPick(s.value);curPersist();render()});root.append(s);return s}
  function curSettings(){
    sheet.classList.add('wm-settings-sheet');
    sheetTitle.textContent='USTAWIENIA WALUT';
    sheetContent.innerHTML=`<div class="wm-settings-meta"><b>Źródło:</b> NBP API<br><b>MASTER:</b> WALUTY 1/1 → 1/2 → 1/3 → 1/4</div><label class="wm-settings-field">Spread / prowizja (%)<input id="wm-spread" class="sheet-input" type="number" inputmode="decimal" step="0.01" min="0" max="20" value="${currencyState.spreadPct}"></label><button type="button" class="sheet-action green wide" data-save>ZAPISZ</button><button type="button" class="sheet-action blue wide" data-refresh>ODŚWIEŻ KURSY</button>`;
    const saveBtn=sheetContent.querySelector('[data-save]'),refreshBtn=sheetContent.querySelector('[data-refresh]'),spread=sheetContent.querySelector('#wm-spread');
    saveBtn.addEventListener('click',()=>{currencyState.spreadPct=Math.max(0,Number(String(spread.value).replace(',','.'))||0);curPersist();closeSheet();if(state.route.startsWith('waluty'))render();toast('✓ Ustawienia WALUT zapisane.')});
    refreshBtn.addEventListener('click',()=>{closeSheet();currencyRefresh(true)});
    sheet.hidden=false;
  }
  function curHistory(){
    let hist=[];try{hist=JSON.parse(localStorage.getItem('crm13_currency_history')||'[]')}catch{}
    sheetTitle.textContent='HISTORIA KURSÓW';
    sheetContent.innerHTML=hist.length?hist.slice(0,12).map(h=>`<div class="sheet-copy"><b>${curTime(h.at)}</b><br>EUR ${curFmt(h.rates?.EUR,4)} • USD ${curFmt(h.rates?.USD,4)} • CZK ${curFmt(h.rates?.CZK,4)} • CHF ${curFmt(h.rates?.CHF,4)} • GBP ${curFmt(h.rates?.GBP,4)}</div>`).join(''):'<div class="sheet-copy">Historia pojawi się po pierwszym odświeżeniu kursów.</div>';
    sheet.hidden=false;
  }
  function wmTop(root,card){wmHot(root,[28,20,155,180],()=>card===1?go('home'):currencyGo(card-1),'Powrót');const ring=document.createElement('div');ring.className='wm-live-ring';wmRect(ring,[700,70,100,100]);root.append(ring);if(currencyState.loading){const sp=document.createElement('div');sp.className='wm-live-spinner';sp.innerHTML='<span>↻</span>';wmRect(sp,[694,64,112,112]);root.append(sp)}wmHot(root,[650,20,190,205],()=>currencyRefresh(true),'LIVE — synchronizuj kursy')}
  function wmBottom(root,card=1){const y=card===4?1652:1580,h=card===4?180:210,w=WM_W/5;wmHot(root,[0,y,w,h],()=>go('home'),'Pulpit');wmHot(root,[w,y,w,h],()=>currencyGo(3),'Kalkulatory');wmHot(root,[w*2,y,w,h],()=>currencyGo(1),'Waluty');wmHot(root,[w*3,y,w,h],curHistory,'Historia');wmHot(root,[w*4,y,w,h],curSettings,'Ustawienia')}
  function wmSwipe(root,card){let sx=0,sy=0,touch=false;root.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.wm-hot,.wm-edit,.wm-select'))return;touch=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});root.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;touch=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.45){if(dx<0&&card<4)currencyGo(card+1);else if(dx>0&&card>1)currencyGo(card-1)}},{passive:true})}
  function wmBase(card){const page=document.createElement('section');page.className='wm-page';page.dataset.card=String(card);const root=document.createElement('div');root.className='wm-canvas';const img=document.createElement('img');img.className='wm-master';img.src=`master-waluty-karta${card}.png?v=R43-LIVE-HARD-FIX`;img.alt=`WALUTY MASTER — 1/${card}`;root.append(img);page.append(root);img.addEventListener('load',()=>{root.style.aspectRatio=`${img.naturalWidth}/${img.naturalHeight}`});wmSwipe(root,card);return{page,root}}

  function renderCurrency1(){const {page,root}=wmBase(1);wmTop(root,1);wmHot(root,[42,710,770,150],()=>currencyGo(2),'Kursy LIVE');wmHot(root,[42,882,770,155],()=>currencyGo(3),'Kalkulator walut');wmHot(root,[42,1055,770,155],()=>currencyGo(4),'Opłacalność / marża');wmHot(root,[42,1227,770,155],curHistory,'Historia kursów');wmHot(root,[42,1398,770,165],curSettings,'Ustawienia walut');wmBottom(root,1);return page}

  function renderCurrency2(){const {page,root}=wmBase(2);wmTop(root,2);const ys=[522,642,762,882,1001];['EUR','USD','CZK','CHF','GBP'].forEach((c,i)=>{const r=curRate(c),d=curChange(c);const diff=Math.abs(r-CURRENCY_MASTER2[c])>.0000001;if(diff||currencyState.updatedAt){wmLive(root,[395,ys[i],190,68],curFmt(r,4),'rate');const cl=d>.0001?'up':d<-.0001?'down':'flat',ar=d>.0001?'▲':d<-.0001?'▼':'•';wmLive(root,[605,ys[i],190,68],`${ar} ${curFmt(Math.abs(d),2)}%`,'delta '+cl)}});
    if(currencyState.updatedAt){
      const a=document.createElement('div');a.className='wm-info-box';a.innerHTML=`<b>ŹRÓDŁO DANYCH</b><span>${currencyState.source}</span>`;wmRect(a,[118,1136,300,122]);root.append(a);
      const b=document.createElement('div');b.className='wm-info-box';b.innerHTML=`<b>OSTATNIA AKTUALIZACJA</b><span>${curTime(currencyState.updatedAt)}</span>`;wmRect(b,[500,1136,288,122]);root.append(b);
      if(!currencyState.online)wmLive(root,[650,1280,125,52],'CACHE','info status');
    }
    wmHot(root,[45,1372,762,180],()=>currencyRefresh(true),'Odśwież kursy');
    if(currencyState.loading){const busy=document.createElement('div');busy.className='wm-refresh-busy';busy.textContent='ODŚWIEŻAM KURSY';wmRect(busy,[55,1400,742,132]);root.append(busy)}
    wmBottom(root,2);return page}

  function curCalc(){const gross=curConvert(currencyState.calcAmount,currencyState.calcFrom,currencyState.calcTo),commission=gross*currencyState.spreadPct/100;return{gross,commission,settle:gross-commission}}
  function renderCurrency3(){const {page,root}=wmBase(3);wmTop(root,3);
    const amountChanged=Math.abs(currencyState.calcAmount-currencyDefaults.calcAmount)>.00001;
    if(amountChanged)wmEdit(root,[82,395,420,110],currencyState.calcAmount,v=>currencyState.calcAmount=v,'big');else{const hit=wmHot(root,[55,375,470,145],()=>{} ,'Kwota');hit.addEventListener('click',()=>{hit.remove();wmEdit(root,[82,395,420,110],currencyState.calcAmount,v=>currencyState.calcAmount=v,'big').focus()},{once:true})}
    wmSelect(root,[535,375,260,145],currencyState.calcFrom,c=>currencyState.calcFrom=c);if(currencyState.calcFrom!==currencyDefaults.calcFrom)wmDyn(root,[585,405,175,80],`${CURRENCY_FLAGS[currencyState.calcFrom]} ${currencyState.calcFrom}`,'gold med');

    [[52,760,230,100,1000],[300,760,230,100,5000],[548,760,230,100,10000]].forEach(([x,y,w,h,v])=>wmHot(root,[x,y,w,h],()=>{currencyState.calcAmount=v;curPersist();render()},String(v)));
    const v=curCalc();wmDyn(root,[195,992,465,90],`${curFmt(v.gross,2)} ${currencyState.calcTo}`,'green big');wmDyn(root,[112,1165,300,78],`1 ${currencyState.calcFrom} = ${curFmt(curConvert(1,currencyState.calcFrom,currencyState.calcTo),6)} ${currencyState.calcTo}`,'gold small');wmDyn(root,[445,1168,295,75],`${curFmt(currencyState.spreadPct,2)}% • ${curFmt(v.commission,2)} ${currencyState.calcTo}`,'gold small');wmDyn(root,[195,1304,500,75],`DO ROZLICZENIA: ${curFmt(v.settle,2)} ${currencyState.calcTo}`,'green small');
    wmHot(root,[52,1405,750,145],()=>{curPersist();render();toast('✓ PRZELICZONO')},'Przelicz');wmBottom(root,3);return page}

  function curProfit(){const purchase=curConvert(currencyState.buyPrice,currencyState.buyCurrency,'PLN'),transport=curConvert(currencyState.transport,currencyState.transportCurrency,'PLN'),spread=purchase*currencyState.spreadPct/100,cost=purchase+transport+spread,sale=curConvert(currencyState.salePrice,currencyState.saleCurrency,'PLN'),profit=sale-cost,margin=sale?profit/sale*100:0;return{cost,sale,profit,margin}}
  function renderCurrency4(){const {page,root}=wmBase(4);wmTop(root,4);
    const buy=wmEdit(root,[400,380,230,82],currencyState.buyPrice,v=>currencyState.buyPrice=v,'med');wmSelect(root,[630,370,160,95],currencyState.buyCurrency,c=>currencyState.buyCurrency=c);if(currencyState.buyCurrency!==currencyDefaults.buyCurrency)wmDyn(root,[646,382,125,66],currencyState.buyCurrency,'gold med');
    wmSelect(root,[395,470,398,92],currencyState.buyCurrency,c=>currencyState.buyCurrency=c);if(currencyState.buyCurrency!==currencyDefaults.buyCurrency)wmDyn(root,[462,485,305,64],`${CURRENCY_FLAGS[currencyState.buyCurrency]} ${currencyState.buyCurrency} — ${CURRENCY_NAMES[currencyState.buyCurrency]}`,'gold small');
    wmEdit(root,[400,570,230,82],currencyState.salePrice,v=>currencyState.salePrice=v,'med');wmSelect(root,[630,565,160,95],currencyState.saleCurrency,c=>currencyState.saleCurrency=c);if(currencyState.saleCurrency!==currencyDefaults.saleCurrency)wmDyn(root,[646,580,125,65],currencyState.saleCurrency,'gold med');
    wmEdit(root,[400,666,230,82],currencyState.transport,v=>currencyState.transport=v,'med');wmSelect(root,[630,662,160,95],currencyState.transportCurrency,c=>currencyState.transportCurrency=c);if(currencyState.transportCurrency!==currencyDefaults.transportCurrency)wmDyn(root,[646,676,125,65],currencyState.transportCurrency,'gold med');

    wmHot(root,[628,758,165,100],()=>{spreadInput.focus();spreadInput.select();toast('SPREAD / PROWIZJA — wpisz wartość w %')},'Spread / prowizja procentowa');

    wmDyn(root,[88,1230,285,100],curFmt(v.margin,2)+'%',good?'green big':'red big');wmDyn(root,[82,1390,300,82],good?'OPŁACALNE':'NIEOPŁACALNE',good?'green med':'red med');
    wmHot(root,[52,1530,748,125],()=>{[buy,spreadInput].forEach(i=>i.blur());curPersist();render();toast('✓ OPŁACALNOŚĆ PRZELICZONA')},'Przelicz opłacalność');
    const recalc=document.createElement('div');recalc.className='wm-profit-recalc';wmRect(recalc,[52,1530,748,125]);root.append(recalc);
    wmBottom(root,4);return page}
  function renderCurrency(){const n=Number(String(state.route).replace('waluty',''))||1;return n===2?renderCurrency2():n===3?renderCurrency3():n===4?renderCurrency4():renderCurrency1()}
  curLoadCache();

  function render(){
    app.innerHTML='';
    let view;
    if(state.route.startsWith('waluty')) view=renderCurrency();
    else if(state.route==='markets') view=renderMarkets();
    else if(state.route==='germany') view=renderGermany();
    else if(state.route==='country') view=renderCountry();
    else if(state.route==='company') view=renderCompany();
    else if(state.route==='settings') view=renderSettingsR20();
    else if(state.route==='settings-update') view=renderSettingsUpdateR20();
    else if(state.route==='settings-backups') view=renderSettingsBackupsR20();
    else if(state.route==='settings-share') view=renderSettingsShareR20();
    else view=renderHome();
    app.append(view);
  }

  document.querySelector('[data-sheet-home]').addEventListener('click',()=>{closeSheet();});
  document.querySelector('[data-sheet-close]').addEventListener('click',closeSheet);
  sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });
  window.addEventListener('popstate',()=>{
    if(!sheet.hidden){closeSheet();return;}
    if(state.route.startsWith('waluty')){const n=Number(state.route.replace('waluty',''))||1;n<=1?go('home'):currencyGo(n-1);} else if(state.route==='company') go('germany'); else if(state.route==='germany'||state.route==='country') go('markets'); else if(state.route==='markets') go('home'); else if(state.route==='settings') go('home'); else if(state.route.startsWith('settings-')) r20Back(state.route);
  });

  if('serviceWorker' in navigator){
    // R43: baza R38 MEGA STABLE + WALUTY MASTER 1:1 + twarde poprawki LIVE/funkcji.
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js?v=R43-waluty-live-hard-fix-1705',{updateViaCache:'none'}).then(reg=>{
        setTimeout(()=>reg.update().catch(()=>{}),1200);
      }).catch(()=>{});
    });
  }

  loadCachedCrmData();
  loadCachedAssistantFeed();
  render();

  // R35 AUTO-SYNC: przy starcie, po powrocie do aplikacji i co 5 minut.
  // Feed asystenta jest sprawdzany wewnątrz loadRemoteData niezależnie od crm-data.json.
  loadRemoteData(false).then(ok=>{ if(ok && state.route!=='home') render(); });
  setInterval(()=>loadRemoteData(false).then(ok=>{ if(ok && state.route!=='home') render(); }),300000);
  window.addEventListener('online',()=>loadRemoteData(false).then(ok=>{ if(ok && state.route!=='home') render(); }));
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      loadRemoteData(false).then(ok=>{ if(ok && state.route!=='home') render(); });
      navigator.serviceWorker?.getRegistration()?.then(r=>r?.update()).catch(()=>{});
    }
  });

  if(new URL(location.href).searchParams.get('build')==='R26'){
    setTimeout(()=>toast('✓ R26 — GLOBAL MASTER NAWIGACJI • START Z PULPITU'),450);
  }
})();
