name: R69 K4 Clean Raster Preview

on:
  push:
    paths:
      - '.github/workflows/r69-k4-clean-raster-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original K4 for local surgical QA
        run: |
          test -f master-waluty-karta4.png
          cp master-waluty-karta4.png master-waluty-karta4-original-qa.png
      - uses: actions/upload-artifact@v4
        with:
          name: r69-k4-original-qa
          path: master-waluty-karta4-original-qa.png
          if-no-files-found: error
