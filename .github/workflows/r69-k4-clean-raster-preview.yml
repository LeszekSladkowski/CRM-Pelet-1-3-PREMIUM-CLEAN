name: R69 K4 Clean Raster Preview

on:
  push:
    paths:
      - '.github/workflows/r69-k4-clean-raster-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python3 -m pip install --quiet opencv-python-headless pillow numpy
      - name: Build clean raster without black masks
        shell: bash
        run: |
          python3 - <<'PY'
          import cv2, numpy as np
          from PIL import Image, ImageDraw, ImageFont
          src = cv2.imread('master-waluty-karta4.png', cv2.IMREAD_COLOR)
          if src is None: raise SystemExit('missing master-waluty-karta4.png')
          h,w = src.shape[:2]
          if (w,h)!=(852,1846): raise SystemExit(f'unexpected size {w}x{h}')
          mask = np.zeros((h,w), np.uint8)
          def rect(x1,y1,x2,y2): cv2.rectangle(mask,(x1,y1),(x2,y2),255,-1)
          def line(x1,y1,x2,y2,t): cv2.line(mask,(x1,y1),(x2,y2),255,t,cv2.LINE_AA)
          rect(505,67,603,126)
          rect(412,389,557,444); rect(648,383,762,438); rect(419,490,776,543)
          rect(412,582,558,638); rect(649,579,760,637)
          rect(412,679,548,735); rect(650,675,760,735); rect(412,777,545,835)
          rect(432,902,626,966); rect(432,1002,626,1068)
          rect(80,1232,338,1318); rect(77,1394,348,1471)
          line(611,1477,737,1370,24); cv2.circle(mask,(611,1477),29,0,-1)
          cleaned = cv2.inpaint(src, mask, 5, cv2.INPAINT_TELEA)
          cv2.imwrite('master-waluty-karta4-r69-clean-pre.png', cleaned, [cv2.IMWRITE_PNG_COMPRESSION,9])
          im = Image.open('master-waluty-karta4-r69-clean-pre.png').convert('RGB'); d=ImageDraw.Draw(im)
          fp='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'
          font=ImageFont.truetype(fp,43); text='4/4'; box=d.textbbox((0,0),text,font=font,stroke_width=1)
          tw=box[2]-box[0]; th=box[3]-box[1]; x=555-tw//2; y=95-th//2-4
          d.text((x+1,y+2),text,font=font,fill=(84,61,13),stroke_width=1,stroke_fill=(24,18,5))
          d.text((x,y),text,font=font,fill=(239,193,79),stroke_width=1,stroke_fill=(121,85,19))
          im.save('master-waluty-karta4-r69-clean.png', optimize=True)
          cv2.imwrite('r69-cleaning-mask.png', mask)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r69-k4-clean-preview
          path: |
            master-waluty-karta4-r69-clean.png
            r69-cleaning-mask.png
          if-no-files-found: error
