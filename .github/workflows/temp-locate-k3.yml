name: TEMP locate K3
on:
  push:
    paths:
      - '.github/workflows/temp-locate-k3.yml'
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate
        run: |
          grep -nE '\.wm-(page|canvas|master|hot|dyn|edit|select|live-ring|pressed)|wm-refresh-busy' index.html | head -180
