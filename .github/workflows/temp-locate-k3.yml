name: TEMP locate K3
on:
  push:
    paths:
      - '.github/workflows/temp-locate-k3.yml'
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate
        run: |
          grep -niE "kalkulatory|calculators|calculator" index.html | head -120
