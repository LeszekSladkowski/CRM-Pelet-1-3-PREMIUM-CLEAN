name: R64 K3 LITERAL HOTFIX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r64-k3-literal-hotfix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escape app template literals and verify runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('`  function renderCurrency3(){')
          b=s.index('  function curProfit(){`', a)
          seg=s[a:b]
          # The ${...} expressions belong to the generated app, not to the Service Worker template.
          seg2=seg.replace('${','\\${')
          if seg2==seg:
              raise SystemExit('R64 literal hotfix: no expressions found')
          s=s[:a]+seg2+s[b:]
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/r64-k3-literal-hotfix.yml').unlink()
          PY
          node --check sw.js
          node - <<'NODE'
          const fs=require('fs');
          global.importScripts=()=>{};
          global.ASSETS=[];
          global.r48PatchIndexHtml=(x)=>x;
          eval(fs.readFileSync('sw.js','utf8'));
          const src=fs.readFileSync('index.html','utf8');
          const out=r48PatchIndexHtml(src);
          const checks=[
            ['R64 raster',out.includes("master-waluty-karta3-r64-clean.webp?v=R64-1348")],
            ['K3 function',out.includes('function renderCurrency3(){const {page,root}=wmBase(3);')],
            ['source LIVE template',out.includes('`${CURRENCY_FLAGS[currencyState.calcFrom]} ${currencyState.calcFrom}`')],
            ['result LIVE template',out.includes('`${curFmt(v.gross,2)} ${currencyState.calcTo}`')],
            ['no cross dynamic',!out.includes("wmDyn(root,[112,1165,300,78]" )],
            ['no spread dynamic',!out.includes("wmDyn(root,[445,1168,295,75]" )]
          ];
          for(const [name,ok] of checks){console.log(name,ok?'OK':'FAIL');if(!ok)process.exitCode=1;}
          NODE
      - name: Commit verified R64 hotfix
        run: |
          git config user.name "L&M CRM Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "R64 K3 runtime literal verification hotfix"
          git push
