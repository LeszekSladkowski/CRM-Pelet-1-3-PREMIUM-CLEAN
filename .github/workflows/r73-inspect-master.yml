name: R73 Inspect K4 Master
on:
  push:
    branches:
      - r73-waluty-k4-final-freeze-candidate
    paths:
      - '.github/workflows/r73-inspect-master.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode historical R69 payload and verify existing sources
        run: |
          base64 -d master-waluty-karta4-r69-master.webp > decoded-r69-k4.webp
          file master-waluty-karta4.png master-waluty-wariant-a-reference.png decoded-r69-k4.webp
          sha256sum master-waluty-karta4.png master-waluty-wariant-a-reference.png decoded-r69-k4.webp
      - uses: actions/upload-artifact@v4
        with:
          name: r73-waluty-source-inspect-r69-decoded
          path: |
            master-waluty-karta4.png
            master-waluty-wariant-a-reference.png
            decoded-r69-k4.webp
