name: R64 K3 EMERGENCY REBUILD
on:
  push:
    branches: [main]
    paths:
      - 'r64-upload/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build R64 K3
        run: python .github/r64-patch.py
      - name: Commit R64
        run: |
          git config user.name "L&M CRM Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "R64 WALUTY KARTA 3 EMERGENCY CLEAN LIVE"
            git push
          fi
