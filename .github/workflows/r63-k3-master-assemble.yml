name: R63 K3 MASTER assemble

on:
  push:
    branches: [ main ]
    paths:
      - 'k3-upload/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble FINAL MASTER
        shell: bash
        run: |
          python - <<'PY'
          import base64, glob, hashlib, sys
          parts=sorted(glob.glob('k3-upload/chunk*.txt'))
          if len(parts)!=8:
              print(f'Waiting for 8 chunks, have {len(parts)}')
              sys.exit(0)
          payload=''.join(''.join(open(p,encoding='ascii').read().split()) for p in parts)
          raw=base64.b64decode(payload,validate=True)
          expected='38e14f7a9acc9f48ed5d17b7605b7387513e0261a127554305c583d374afd35b'
          got=hashlib.sha256(raw).hexdigest()
          if got!=expected:
              raise SystemExit(f'SHA256 mismatch: {got}')
          open('master-waluty-karta3-final-master.webp','wb').write(raw)
          print('MASTER bytes:',len(raw),'SHA256:',got)
          PY
          if [ ! -f master-waluty-karta3-final-master.webp ]; then
            exit 0
          fi
          rm -rf k3-upload
          rm -f .github/workflows/r63-k3-master-assemble.yml
          git config user.name "L&M CRM Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "R63 WALUTY KARTA 3: wgraj FINAL MASTER 852x1846" || exit 0
          git push
