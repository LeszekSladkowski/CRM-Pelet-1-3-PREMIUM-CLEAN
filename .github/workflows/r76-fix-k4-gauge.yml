name: R76 Surgical K4 Gauge Cleanup

on:
  push:
    branches:
      - r76-waluty-k4-surgical-clean

permissions:
  contents: write

jobs:
  surgical-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCV
        run: python -m pip install --quiet opencv-python-headless

      - name: Remove only the remaining baked right-side needle ghost
        shell: bash
        run: |
          python - <<'PY'
          import cv2, numpy as np, json, pathlib, base64

          asset = pathlib.Path('master-waluty-karta4-r74-runtime-clean.png')
          img = cv2.imread(str(asset), cv2.IMREAD_COLOR)
          if img is None:
              raise SystemExit('Cannot read runtime asset')
          h, w = img.shape[:2]
          if (w, h) != (852, 1846):
              raise SystemExit(f'Unexpected asset size: {w}x{h}')

          before = img.copy()
          mask = np.zeros((h, w), dtype=np.uint8)

          # Surgical polygon: only the baked/ghost pointer extending from the hub
          # toward the upper-right. The arc, ticks and center hub stay outside it.
          pts = np.array([
              [603, 1407],
              [620, 1388],
              [708, 1327],
              [733, 1318],
              [724, 1347],
              [636, 1427],
              [617, 1451],
              [604, 1448],
          ], dtype=np.int32)
          cv2.fillConvexPoly(mask, pts, 255)
          mask = cv2.dilate(mask, cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5,5)), iterations=1)

          # Absolute protection of the approved center hub.
          cv2.circle(mask, (592, 1440), 29, 0, -1)

          cleaned = cv2.inpaint(img, mask, 7, cv2.INPAINT_TELEA)
          cv2.imwrite(str(asset), cleaned, [cv2.IMWRITE_PNG_COMPRESSION, 9])

          # Hard audit: pixels outside the surgical mask must remain byte-identical.
          outside = mask == 0
          outside_diff = int(np.max(np.abs(before.astype(np.int16)-cleaned.astype(np.int16))[outside]))
          changed = int(np.count_nonzero(np.any(before != cleaned, axis=2)))
          print(f'R76_AUDIT size={w}x{h} changed_pixels={changed} max_diff_outside_mask={outside_diff}')
          if outside_diff != 0:
              raise SystemExit('Audit failed: pixels outside surgical mask changed')

          # Print a compact gauge crop for visual verification from workflow logs.
          crop = cleaned[1160:1505, 380:790]
          ok, enc = cv2.imencode('.png', crop, [cv2.IMWRITE_PNG_COMPRESSION, 9])
          if not ok:
              raise SystemExit('Could not encode audit crop')
          print('R76_GAUGE_CROP_BASE64_BEGIN')
          print(base64.b64encode(enc.tobytes()).decode('ascii'))
          print('R76_GAUGE_CROP_BASE64_END')

          sw = pathlib.Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          replacements = {
              '/* R75 — WALUTY KARTA 4 NEEDLE CLEAN CANDIDATE.':'/* R76 — WALUTY KARTA 4 SURGICAL GAUGE CLEAN CANDIDATE.',
              'const R75_K4_ASSETS=[':'const R76_K4_ASSETS=[',
              'R75_K4_ASSETS.forEach':'R76_K4_ASSETS.forEach',
              '1.3.0-master-r75-waluty-karta4-needle-clean':'1.3.0-master-r76-waluty-karta4-surgical-gauge-clean',
              'R75 WALUTY KARTA 4 NEEDLE CLEAN':'R76 WALUTY KARTA 4 SURGICAL GAUGE CLEAN',
              "const BUILD_TIME = '16:45';":"const BUILD_TIME = '17:58';",
              "./sw.js?v=R75-waluty-karta4-needle-clean-1645":"./sw.js?v=R76-waluty-karta4-surgical-gauge-clean-1758",
              'master-waluty-karta4-r74-runtime-clean.png?v=R75-final-1645':'master-waluty-karta4-r74-runtime-clean.png?v=R76-final-1758',
              'waluty-k4-r72-live-arrows.png?v=R75-final-1645':'waluty-k4-r72-live-arrows.png?v=R76-final-1758',
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit(f'Missing expected sw.js token: {a}')
              s = s.replace(a,b)
          sw.write_text(s, encoding='utf-8')

          version = {
            'version': '1.3.0-master-r76-waluty-karta4-surgical-gauge-clean',
            'release': 'R76 WALUTY KARTA 4 SURGICAL GAUGE CLEAN',
            'buildDate': '02.09.2026',
            'buildTime': '17:58',
            'base': 'R75 + chirurgiczna korekta wyłącznie rastra runtime KARTY 4 w obszarze prawego ducha starej wskazówki.',
            'notes': [
              'WALUTY KARTA 1: FINAL MASTER — bez zmian.',
              'WALUTY KARTA 2: FINAL MASTER — bez zmian.',
              'WALUTY KARTA 3: FINAL MASTER — bez zmian.',
              'WALUTY KARTA 4: usunięto wyłącznie pozostały wypalony ciemny artefakt starej wskazówki po prawej stronie tarczy.',
              'WALUTY KARTA 4: piasta, łuk, podziałka, LIVE, pola, selektory, obliczenia, MARŻA, status i PRZELICZ bez zmian.',
              'WALUTY KARTA 4: aktywna pozostaje jedna dynamiczna wskazówka.',
              'Status: kandydat R76 do testu na Samsung Galaxy S24 Ultra; bez statusu FINAL do potwierdzenia użytkownika.'
            ]
          }
          pathlib.Path('version.json').write_text(json.dumps(version, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Commit only surgical production changes
        shell: bash
        run: |
          rm -f .github/workflows/r76-fix-k4-gauge.yml
          git config user.name "LESZEK ŚLADKOWSKI"
          git config user.email "tellechkielce@gmail.com"
          git add master-waluty-karta4-r74-runtime-clean.png sw.js version.json .github/workflows/r76-fix-k4-gauge.yml
          git commit -m "R76: surgical cleanup of remaining K4 gauge ghost needle"
          git push origin HEAD:r76-waluty-k4-surgical-clean
