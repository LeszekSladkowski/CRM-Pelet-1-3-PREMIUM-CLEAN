name: R75 Fix K4 Needle Runtime

on:
  push:
    branches:
      - r75-waluty-k4-final-needle-clean
    paths:
      - '.github/workflows/r75-fix-needle-runtime.yml'

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r75-waluty-k4-final-needle-clean
      - name: Install image tooling
        run: python -m pip install --quiet opencv-python-headless numpy
      - name: Remove only remaining static needle artifact
        run: |
          python - <<'PY'
          import cv2, numpy as np
          clean=cv2.imread('master-waluty-karta4-r74-runtime-clean.png')
          orig=cv2.imread('master-waluty-karta4.png')
          if clean is None or orig is None or clean.shape[:2]!=(1846,852) or orig.shape[:2]!=(1846,852):
              raise SystemExit('K4 runtime/master missing or wrong dimensions')
          h,w=clean.shape[:2]; cx,cy=592,1440
          Y,X=np.mgrid[0:h,0:w]; dx=X-cx; dy=Y-cy
          r=np.sqrt(dx*dx+dy*dy); ang=np.degrees(np.arctan2(dy,dx))
          rad=np.zeros((181,3),np.float32)
          for rr in range(181):
              band=(r>=rr-.5)&(r<rr+.5)&~((ang>-70)&(ang<5))
              pix=orig[band]
              if len(pix)==0:
                  rad[rr]=[8,10,9]; continue
              mx=pix.max(axis=1); dark=pix[mx<75]
              if len(dark)<10: dark=pix[np.argsort(mx)[:max(10,len(pix)//4)]]
              rad[rr]=np.median(dark,axis=0)
          ri=np.clip(np.rint(r).astype(int),0,180)
          bg=rad[ri].astype(np.uint8)
          out=clean.copy(); a0,a1=-62,-8
          mask=((r>30)&(r<151)&(ang>a0)&(ang<a1)).astype(np.float32)
          mask=cv2.GaussianBlur(mask,(0,0),3)[:,:,None]
          out=(bg.astype(np.float32)*mask+out.astype(np.float32)*(1-mask)).astype(np.uint8)
          outer=((r>=148)&(r<180)&(ang>a0)&(ang<a1)).astype(np.float32)
          outer=cv2.GaussianBlur(outer,(0,0),1.5)[:,:,None]
          out=(orig.astype(np.float32)*outer+out.astype(np.float32)*(1-outer)).astype(np.uint8)
          hub=(r<32)[:,:,None]
          out=np.where(hub,clean,out)
          if not cv2.imwrite('master-waluty-karta4-r75-runtime-clean.png',out):
              raise SystemExit('failed to write R75 runtime')
          print('R75 runtime ready:',out.shape)
          PY
      - name: Commit corrected runtime asset
        run: |
          git config user.name 'LESZEK ŚLADKOWSKI'
          git config user.email 'tellechkielce@gmail.com'
          git add master-waluty-karta4-r75-runtime-clean.png
          git commit -m 'R75: remove remaining static needle artifact from K4 runtime'
          git push origin HEAD:r75-waluty-k4-final-needle-clean
