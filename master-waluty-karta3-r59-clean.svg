<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1846" viewBox="0 0 852 1846" preserveAspectRatio="none">
  <!-- R59 FINAL TEST: oryginalny MASTER KARTY 3 pozostaje bazą 1:1. Usuwamy tylko wypalone przykładowe dane. -->
  <image href="master-waluty-karta3.png" x="0" y="0" width="852" height="1846" preserveAspectRatio="none"/>

  <!-- Pola wewnętrzne w MASTER-ze są praktycznie #010101; wypełnienia nie dotykają ramek ani etykiet. -->
  <!-- KWOTA -->
  <rect x="68" y="440" width="195" height="86" rx="3" fill="#010101"/>
  <!-- WALUTA ŹRÓDŁOWA: flaga + kod, strzałka i ramka pozostają z MASTER-a -->
  <rect x="548" y="444" width="184" height="82" rx="3" fill="#010101"/>
  <!-- WALUTA DOCELOWA: flaga + opis; strzałka i ramka pozostają z MASTER-a -->
  <rect x="70" y="666" width="420" height="86" rx="3" fill="#010101"/>
  <!-- WYNIK -->
  <rect x="145" y="1018" width="560" height="112" rx="3" fill="#010101"/>
  <!-- KURS KRZYŻOWY — tylko wartość, etykieta pozostaje -->
  <rect x="88" y="1206" width="316" height="96" rx="3" fill="#010101"/>
  <!-- SPREAD / PROWIZJA — tylko wartości, etykieta pozostaje -->
  <rect x="432" y="1206" width="316" height="104" rx="3" fill="#010101"/>
  <!-- DO ROZLICZENIA -->
  <rect x="142" y="1322" width="568" height="94" rx="3" fill="#010101"/>
</svg>
